<!DOCTYPE html>
<html lang="en">
<head>
    <title>Ostoja na rozwidleniu</title>
</head>
<body>

<h2>Gawędź z podróżnikami</h2>

<label for="message">Plotkuj w karczmie:</label>
<input type="text" id="message" placeholder="Opowiadaj...">
<button onclick="sendMessage()">Wyślij</button>
<pre id="config"></pre>

<h3>O co możesz zapytać się karczmarza:</h3>
<ul id="commands">
    <li>!kategorie - jakiego rodzaju towary</li>
    <li>!kategoria &lt;nazwa&gt; - towary danego rodzaju</li>
    <li>!czat &lt;wiadomość&gt; - rozmawiaj z karczmarzem</li>
</ul>


<h2>Nowinki zasłuchane w karczmie</h2>
<div style="display: flex; flex-direction: row; justify-content: center">

</div>
<ul id="messages"></ul>

<script>
    async function sendMessage() {
        const message = document.getElementById("message").value;

        await fetch("/webhook/send", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ message })
        });

        alert("Message sent!");
    }

    async function loadMessages() {
        const response = await fetch("/bot/messages");
        const messages = await response.json();
        const list = document.getElementById("messages");
        list.innerHTML = messages.map(m =>
            `<li><strong>${m.author}</strong> in #${m.channel}: ${m.content}</li>`
        ).join("");
    }

    document.addEventListener("DOMContentLoaded", async () => {
        const response = await fetch("/webhook/config");
        document.getElementById("config").textContent = await response.text();
        await loadMessages();
        setInterval(loadMessages, 5000);
    });

    document.addEventListener("DOMContentLoaded", async () => {
        const commands = await fetch()
    })

</script>

</body>
</html>
